<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Convergence Paper Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f6f1e8;
      --surface: #fffcf7;
      --surface-2: #f0ebe2;
      --text: #1c1917;
      --muted: #78716c;
      --line: #e4ddd2;
      --a: #6d28d9;
      --b: #0f766e;
      --c: #c2410c;
      --spy: #57534e;
      --up: #047857;
      --down: #b91c1c;
      --warn: #b45309;
      --shadow: 0 1px 3px rgba(28, 25, 23, 0.06), 0 4px 12px rgba(28, 25, 23, 0.04);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 1.25rem 1.25rem 0.85rem;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0 0 0.35rem;
      font-family: "IBM Plex Serif", Georgia, serif;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .tagline { margin: 0; font-size: 0.92rem; color: var(--muted); max-width: 42rem; line-height: 1.45; }
    main { max-width: 1040px; margin: 0 auto; padding: 1.25rem 1.25rem 2rem; }
    .hero { display: grid; gap: 0.75rem; margin-bottom: 1.25rem; }
    .hero-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      box-shadow: var(--shadow);
    }
    .hero-card h2 {
      margin: 0 0 0.35rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .hero-card p { margin: 0; font-size: 0.88rem; color: var(--text); line-height: 1.45; }
    .profile-pills { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.5rem; }
    .pill {
      font-size: 0.76rem;
      font-weight: 600;
      padding: 0.22rem 0.5rem;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text);
    }
    .portfolio-explainer { display: grid; gap: 0.55rem; margin-top: 0.15rem; }
    @media (min-width: 720px) { .portfolio-explainer { grid-template-columns: 1fr 1fr 1fr; } }
    .explainer-box {
      border-radius: 8px;
      padding: 0.55rem 0.65rem;
      font-size: 0.82rem;
      line-height: 1.4;
    }
    .explainer-box strong { display: block; font-size: 0.76rem; margin-bottom: 0.12rem; }
    .explainer-box.a { background: rgba(109, 40, 217, 0.08); border-left: 3px solid var(--a); }
    .explainer-box.a strong { color: var(--a); }
    .explainer-box.b { background: rgba(15, 118, 110, 0.08); border-left: 3px solid var(--b); }
    .explainer-box.b strong { color: var(--b); }
    .explainer-box.c { background: rgba(194, 65, 12, 0.08); border-left: 3px solid var(--c); }
    .explainer-box.c strong { color: var(--c); }
    .prices-strip { font-size: 0.78rem; color: var(--muted); margin-bottom: 1rem; }
    .prices-strip .warn { color: var(--warn); font-weight: 500; }
    .spy-section, .portfolio-block {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow);
    }
    .spy-section h2, .portfolio-block h2 {
      margin: 0 0 0.25rem;
      font-size: 1rem;
      font-weight: 700;
    }
    .portfolio-block .block-sub {
      margin: 0 0 0.75rem;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .portfolio-block.block-a h2 { color: var(--a); }
    .portfolio-block.block-b h2 { color: var(--b); }
    .portfolio-block.block-c h2 { color: var(--c); }
    .spy-section h2 { color: var(--spy); }
    .spy-head { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: baseline; margin-bottom: 0.65rem; }
    .spy-stat { font-size: 0.85rem; color: var(--muted); }
    .spy-stat strong { color: var(--text); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
    .spy-stat.since strong.up { color: var(--up); }
    .spy-stat.since strong.down { color: var(--down); }
    .variant-grid {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(3, 1fr);
    }
    @media (max-width: 900px) { .variant-grid { grid-template-columns: 1fr; } }
    .variant-card {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
    }
    .variant-card .variant-label {
      margin: 0 0 0.45rem;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
    }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.4rem; margin-bottom: 0.45rem; }
    .badge {
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.15rem 0.35rem;
      border-radius: 5px;
      white-space: nowrap;
    }
    .badge.ahead { background: rgba(4, 120, 87, 0.12); color: var(--up); }
    .badge.behind { background: rgba(185, 28, 28, 0.1); color: var(--down); }
    .badge.flat { background: var(--surface); color: var(--muted); }
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.3rem; margin-bottom: 0.55rem; }
    .metric { background: var(--surface); border-radius: 6px; padding: 0.3rem 0.25rem; text-align: center; }
    .metric-label { display: block; font-size: 0.55rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
    .metric-value { font-size: 0.88rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .metric-value.up { color: var(--up); }
    .metric-value.down { color: var(--down); }
    .metric-value.neutral { color: var(--text); }
    .chart-box {
      position: relative;
      height: 120px;
      overflow: hidden;
      width: 100%;
    }
    .chart-box canvas { max-width: 100% !important; }
    .a-single { margin-bottom: 1.25rem; }
    .a-single .variant-card { max-width: 100%; }
    .spy-metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.35rem; margin-bottom: 0.65rem; }
    @media (max-width: 720px) { .spy-metrics { grid-template-columns: repeat(2, 1fr); } }
    .filter-stats { display: flex; gap: 0.75rem; flex-wrap: wrap; font-size: 0.72rem; color: var(--muted); margin-top: 0.25rem; }
    .filter-stats strong { color: var(--text); font-variant-numeric: tabular-nums; }
    .holdings { margin-top: 0.45rem; padding-top: 0.4rem; border-top: 1px solid var(--line); font-size: 0.72rem; }
    .holdings-label { font-weight: 600; color: var(--muted); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.12rem; }
    .holdings-tickers { line-height: 1.4; word-break: break-word; color: var(--text); }
    .holdings-tickers.empty { color: var(--muted); font-style: italic; }
    footer { max-width: 1040px; margin: 0 auto; padding: 0 1.25rem 1.25rem; font-size: 0.7rem; color: var(--muted); }
    .error { color: var(--down); font-weight: 600; }
    .site-nav { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.85rem; }
    .tab-btn {
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--muted);
      cursor: pointer;
    }
    .tab-btn.active { background: var(--text); color: var(--surface); border-color: var(--text); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .intro-hero { font-size: 1rem; line-height: 1.55; margin: 0 0 0.75rem; max-width: 40rem; }
    .intro-note { font-size: 0.82rem; color: var(--muted); margin: 0 0 1rem; max-width: 42rem; }
    .class-grid {
      display: grid;
      gap: 0.35rem;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    }
    .class-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.45rem 0.55rem;
      font-size: 0.78rem;
    }
    .class-card .ticker { font-weight: 700; font-variant-numeric: tabular-nums; }
    .class-card .state { color: var(--text); margin-top: 0.1rem; }
    .class-card .date { color: var(--muted); font-size: 0.68rem; margin-top: 0.15rem; }
    .app-framing { font-size: 0.88rem; color: var(--muted); margin-bottom: 1rem; max-width: 42rem; }
    .event-section { margin-bottom: 1.25rem; }
    .event-section h3 {
      margin: 0 0 0.5rem;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .event-list { display: grid; gap: 0.45rem; }
    .event-item {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.55rem 0.65rem;
      font-size: 0.82rem;
      line-height: 1.4;
    }
    .event-item .verdict {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      margin-right: 0.35rem;
    }
    .verdict.confirmed { background: rgba(4,120,87,0.12); color: var(--up); }
    .verdict.falsified { background: rgba(185,28,28,0.1); color: var(--down); }
    .finding-def { font-size: 0.78rem; color: var(--muted); margin-top: 0.25rem; }
    .metric-def { font-size: 0.72rem; color: var(--muted); font-style: italic; margin-top: 0.15rem; }
    .illus-note { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.75rem; max-width: 42rem; }
</head>
<body>
  <header>
    <h1>Convergence</h1>
    <p class="tagline">Observes and classifies how the relationship between price behavior and financial-structure behavior changes over time.</p>
    <nav class="site-nav" aria-label="Site sections">
      <button type="button" class="tab-btn active" data-tab="evidence">Why this exists</button>
      <button type="button" class="tab-btn" data-tab="application">Application</button>
      <button type="button" class="tab-btn" data-tab="activity">Recent activity</button>
    </nav>
  </header>
  <main>
    <section id="tab-evidence" class="tab-panel active">
      <div id="evidence-page">Loading evidence…</div>
    </section>

    <section id="tab-application" class="tab-panel">
      <p class="app-framing">What happens when these observations are used as an investment input.</p>
      <div class="hero">
        <div class="hero-card">
          <h2>Three versions of the same framework</h2>
          <p>Mix 1, Mix 2, and Mix 3 are three different combinations of company types the framework can hold, tested side by side. They&rsquo;re not a spectrum from safer to riskier — just different mixes we wanted to compare.</p>
          <div class="profile-pills">
            <span class="pill">Mix 1</span>
            <span class="pill">Mix 2</span>
            <span class="pill">Mix 3</span>
          </div>
        </div>
        <div class="hero-card">
          <h2>What each portfolio does</h2>
          <div class="portfolio-explainer">
            <div class="explainer-box a">
              <strong>Portfolio A · Structural Filter</strong>
              Removes companies with red flags from a broad list; holds the rest evenly.
            </div>
            <div class="explainer-box b">
              <strong>Portfolio B · Pure Convergence</strong>
              The framework alone — no AI or human input, random tie-break among equally eligible candidates.
            </div>
            <div class="explainer-box c">
              <strong>Portfolio C · Convergence + Human</strong>
              Same eligible pool as Portfolio B, but a human makes the final selection.
            </div>
          </div>
        </div>
      </div>
      <p class="prices-strip" id="prices-strip">Loading…</p>
      <div id="portfolio-a"></div>
      <div id="portfolios"></div>
      <section class="spy-section" id="spy-section" hidden>
        <h2>SPY benchmark</h2>
        <div class="spy-metrics" id="spy-metrics"></div>
        <div class="spy-head">
          <div class="spy-stat" id="spy-refreshed">Last refreshed: —</div>
        </div>
        <div class="chart-box"><canvas id="chart-spy-benchmark" aria-label="SPY return since tracking start"></canvas></div>
      </section>
    </section>

    <section id="tab-activity" class="tab-panel">
      <p class="intro-hero">Current structural classifications and operational decisions across all portfolios.</p>
      <p class="intro-note" id="class-count"></p>
      <div class="event-section">
        <h3>Current classifications</h3>
        <div class="class-grid" id="classifications-grid">Loading classifications…</div>
      </div>
      <div id="activity-page">Loading activity log…</div>
    </section>
  </main>
  <footer id="footer"></footer>

  <script>
    const PROFILE_ORDER = ["conservative", "balanced", "aggressive"];
    const PROFILE_LABELS = {
      conservative: "Mix 1",
      balanced: "Mix 2",
      aggressive: "Mix 3",
    };
    // Display letters A/B/C (page order) map to internal data keys in live_cycles.json
    const PORTFOLIO_META = {
      A: {
        dataKey: "C",
        title: "Portfolio A · Structural Filter",
        single: true,
        sub: "Structural filter applied once — identical holdings and rules across Mix 1, Mix 2, and Mix 3.",
      },
      B: {
        dataKey: "A",
        title: "Portfolio B · Pure Convergence",
        single: false,
      },
      C: {
        dataKey: "B",
        title: "Portfolio C · Convergence + Human",
        single: false,
      },
    };
    const DISPLAY_ORDER = ["A", "B", "C"];
    const MULTI_VARIANT_DISPLAY = ["B", "C"];
    const CHART_COLORS = { A: "#6d28d9", B: "#0f766e", C: "#c2410c", SPY: "#78716c" };
    const charts = [];

    function dataKeyFor(displayLetter) {
      return PORTFOLIO_META[displayLetter].dataKey;
    }

    function fmtPrice(v) {
      if (v == null || Number.isNaN(v)) return "—";
      return "$" + Number(v).toFixed(2);
    }

    function fmtRet(v) {
      if (v == null || Number.isNaN(v)) return "—";
      const pct = Math.round(v * 10000) / 100;
      const sign = pct > 0 ? "+" : "";
      return sign + pct.toFixed(2) + "%";
    }

    function retClass(v) {
      if (v == null || Number.isNaN(v)) return "neutral";
      if (v > 0.00005) return "up";
      if (v < -0.00005) return "down";
      return "neutral";
    }

    function fmtTimestamp(iso) {
      if (!iso) return "—";
      try {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso;
        return d.toLocaleString("en-SG", {
          dateStyle: "medium",
          timeStyle: "short",
          timeZone: "Asia/Singapore",
        }) + " SGT";
      } catch (_) {
        return iso;
      }
    }

    function yAxisBounds(data) {
      const vals = data.filter((v) => v != null && !Number.isNaN(v));
      const minVal = vals.length ? Math.min(...vals, 0) : -0.5;
      const maxVal = vals.length ? Math.max(...vals, 0) : 0.5;
      const span = maxVal - minVal || 1;
      const pad = Math.max(0.25, span * 0.12);
      let min = minVal - pad;
      let max = maxVal + pad;
      if (min > 0) min = -0.25;
      if (max < 0) max = 0.25;
      return { min, max };
    }

    async function loadJson(name) {
      const url = new URL("data/" + name, window.location.href).href;
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(name + ": HTTP " + res.status);
      return res.json();
    }

    function computeReturnsFallback(p, series) {
      const since = p.gain_loss_pct_since_inception;
      const month = p.return_since_review;
      const pts = series?.chart_points || (series?.points || []).map((pt) => ({
        portfolio_pct: pt.nav_index - 100,
        spy_pct: pt.spy_index - 100,
      }));
      const last = pts[pts.length - 1];
      const spySince = last ? last.spy_pct / 100 : 0;
      return {
        since_start_pct: since,
        month_pct: month,
        ytd_pct: since,
        vs_spy_since_start_pct: since != null ? since - spySince : null,
      };
    }

    function getHoldings(dataKey, cycle, p) {
      const tickers = p.holdings_display || p.tickers || [];
      if (tickers.length) return tickers.join(", ");
      if (dataKey === "B") {
        const picks = cycle.b_holding_now || [];
        const all = [];
        for (const h of picks) {
          const ts = h.recorded_picks || [];
          if (ts.length) all.push(...ts);
          else if (h.holding_now || h.ticker) all.push(h.holding_now || h.ticker);
        }
        if (all.length) {
          const flat = [];
          for (const item of all) {
            for (const t of String(item).split(/,\s*/)) {
              if (t) flat.push(t.toUpperCase());
            }
          }
          return [...new Set(flat)].join(", ");
        }
      }
      return null;
    }

    function aheadBadge(returns) {
      const vs = returns?.vs_spy_since_start_pct;
      if (vs == null || Number.isNaN(vs)) return '<span class="badge flat">vs SPY —</span>';
      if (vs > 0.00005) return '<span class="badge ahead">' + fmtRet(vs) + " vs SPY</span>";
      if (vs < -0.00005) return '<span class="badge behind">' + fmtRet(vs) + " vs SPY</span>";
      return '<span class="badge flat">Even</span>';
    }

    function renderVariantCard(displayLetter, profileKey, cycle) {
      const dataKey = dataKeyFor(displayLetter);
      const p = cycle.portfolios?.[dataKey] || {};
      const series = cycle.performance_vs_spy?.[dataKey];
      const ret = p.returns_pct || computeReturnsFallback(p, series);
      const holdings = getHoldings(dataKey, cycle, p);
      const chartId = "chart-" + displayLetter + "-" + profileKey;
      const label = PROFILE_LABELS[profileKey] || profileKey;

      let filterStats = "";
      if (dataKey === "C") {
        const f = cycle.portfolio_c_filter || {};
        filterStats = '<div class="filter-stats"><span>Excluded <strong>' + (f.n_excluded ?? "—") +
          "</strong></span><span>Forensic fail <strong>" + (f.n_forensic_reject ?? "—") + "</strong></span></div>";
      }

      const holdingsLabel = dataKey === "C"
        ? (p.n_holdings || (p.holdings_display || []).length || 126) + " holdings (same across all versions)"
        : "Holdings";

      const tickers = p.holdings_display || p.tickers || [];
      const n = p.n_holdings || tickers.length;
      const holdingsText = dataKey === "C" && tickers.length > 14
        ? tickers.slice(0, 10).join(", ") + " … +" + (n - 10) + " more"
        : (holdings || "None");

      return (
        '<article class="variant-card">' +
        '<p class="variant-label">' + label + "</p>" +
        '<div class="card-head">' + aheadBadge(ret) + "</div>" +
        '<div class="metrics">' +
        '<div class="metric"><span class="metric-label">Since start</span><span class="metric-value ' + retClass(ret.since_start_pct) + '">' + fmtRet(ret.since_start_pct) + "</span></div>" +
        '<div class="metric"><span class="metric-label">YTD</span><span class="metric-value ' + retClass(ret.ytd_pct) + '">' + fmtRet(ret.ytd_pct) + "</span></div>" +
        '<div class="metric"><span class="metric-label">Month</span><span class="metric-value ' + retClass(ret.month_pct) + '">' + fmtRet(ret.month_pct) + "</span></div>" +
        "</div>" +
        '<div class="chart-box"><canvas id="' + chartId + '"></canvas></div>' +
        filterStats +
        '<div class="holdings"><div class="holdings-label">' + holdingsLabel + "</div>" +
        '<div class="holdings-tickers' + (holdings ? "" : " empty") + '">' + holdingsText + "</div>" +
        "</article>"
      );
    }

    function renderPortfolioASection(cycle) {
      if (!cycle) return "";
      const meta = PORTFOLIO_META.A;
      const dataKey = meta.dataKey;
      const p = cycle.portfolios?.[dataKey] || {};
      const series = cycle.performance_vs_spy?.[dataKey];
      const ret = p.returns_pct || computeReturnsFallback(p, series);
      const f = cycle.portfolio_c_filter || {};
      const tickers = p.holdings_display || p.tickers || [];
      const n = p.n_holdings || tickers.length;
      const holdingsText = tickers.length > 14
        ? tickers.slice(0, 10).join(", ") + " … +" + (n - 10) + " more"
        : (tickers.length ? tickers.join(", ") : "None");

      return (
        '<section class="portfolio-block block-a a-single">' +
        "<h2>" + meta.title + "</h2>" +
        '<p class="block-sub">' + meta.sub + "</p>" +
        '<article class="variant-card">' +
        '<div class="card-head">' + aheadBadge(ret) + "</div>" +
        '<div class="metrics">' +
        '<div class="metric"><span class="metric-label">Since start</span><span class="metric-value ' + retClass(ret.since_start_pct) + '">' + fmtRet(ret.since_start_pct) + "</span></div>" +
        '<div class="metric"><span class="metric-label">YTD</span><span class="metric-value ' + retClass(ret.ytd_pct) + '">' + fmtRet(ret.ytd_pct) + "</span></div>" +
        '<div class="metric"><span class="metric-label">Month</span><span class="metric-value ' + retClass(ret.month_pct) + '">' + fmtRet(ret.month_pct) + "</span></div>" +
        "</div>" +
        '<div class="chart-box"><canvas id="chart-A-single"></canvas></div>' +
        '<div class="filter-stats"><span>Excluded <strong>' + (f.n_excluded ?? "—") +
        "</strong></span><span>Forensic fail <strong>" + (f.n_forensic_reject ?? "—") + "</strong></span></div>" +
        '<div class="holdings"><div class="holdings-label">' + n + " holdings (same across all versions)</div>" +
        '<div class="holdings-tickers' + (tickers.length ? "" : " empty") + '">' + holdingsText + "</div>" +
        "</article></section>"
      );
    }

    function renderPortfolioBlock(displayLetter, cyclesByProfile) {
      const meta = PORTFOLIO_META[displayLetter];
      const blockClass = "portfolio-block block-" + displayLetter.toLowerCase();
      const cards = PROFILE_ORDER.map((pk) => {
        const cycle = cyclesByProfile[pk];
        if (!cycle) return "";
        return renderVariantCard(displayLetter, pk, cycle);
      }).join("");

      return (
        '<section class="' + blockClass + '">' +
        "<h2>" + meta.title + "</h2>" +
        '<div class="variant-grid">' + cards + "</div></section>"
      );
    }

    const zeroLinePlugin = {
      id: "zeroLine",
      afterDatasetsDraw(chart) {
        const yScale = chart.scales.y;
        if (!yScale) return;
        const y0 = yScale.getPixelForValue(0);
        const { top, bottom, left, right } = chart.chartArea;
        if (y0 < top || y0 > bottom) return;
        const ctx = chart.ctx;
        ctx.save();
        ctx.strokeStyle = "rgba(87, 83, 78, 0.55)";
        ctx.lineWidth = 1.25;
        ctx.beginPath();
        ctx.moveTo(left, y0);
        ctx.lineTo(right, y0);
        ctx.stroke();
        ctx.fillStyle = "#78716c";
        ctx.font = '600 8px "IBM Plex Sans", system-ui, sans-serif';
        ctx.fillText("0%", left + 2, y0 - 3);
        ctx.restore();
      },
    };

    const endLabelPlugin = {
      id: "endLabels",
      afterDatasetsDraw(chart) {
        const { ctx, chartArea } = chart;
        const ds = chart.data.datasets[0];
        if (!ds) return;
        const meta = chart.getDatasetMeta(0);
        const pt = meta.data[meta.data.length - 1];
        const val = ds.data[ds.data.length - 1];
        if (!pt || val == null) return;
        const label = (val >= 0 ? "+" : "") + Number(val).toFixed(2) + "%";
        ctx.save();
        ctx.font = '600 9px "IBM Plex Sans", system-ui, sans-serif';
        ctx.fillStyle = ds.borderColor;
        const tw = ctx.measureText(label).width;
        const pad = 4;
        let x = pt.x + pad;
        if (x + tw > chartArea.right - 2) x = Math.max(chartArea.left + 2, pt.x - tw - pad);
        ctx.fillText(label, x, pt.y + 3);
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      },
    };

    function portfolioSeriesData(series) {
      const pts = series?.chart_points || [];
      if (!pts.length && series?.points) {
        series.points.forEach((p) => {
          if (p.nav_index != null) pts.push({ date: p.date, portfolio_pct: p.nav_index - 100 });
        });
      }
      return {
        labels: pts.map((p) => p.date.slice(5)),
        data: pts.map((p) => Math.round((p.portfolio_pct ?? 0) * 100) / 100),
      };
    }

    function buildPortfolioChart(canvas, series, displayLetter) {
      const { labels, data } = portfolioSeriesData(series);
      if (!labels.length) return null;
      const color = CHART_COLORS[displayLetter] || CHART_COLORS.A;
      const bounds = yAxisBounds(data);
      const rgb = color.replace("#", "").match(/.{2}/g);
      const fillAlpha = rgb
        ? "rgba(" + parseInt(rgb[0], 16) + "," + parseInt(rgb[1], 16) + "," + parseInt(rgb[2], 16) + ",0.12)"
        : "rgba(15,118,110,0.12)";

      return new Chart(canvas, {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: displayLetter,
            data,
            borderColor: color,
            backgroundColor: fillAlpha,
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.15,
            fill: true,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 6, right: 52, bottom: 2, left: 4 } },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label(ctx) {
                  return (ctx.parsed.y >= 0 ? "+" : "") + ctx.parsed.y.toFixed(2) + "%";
                },
              },
            },
          },
          scales: {
            x: {
              grid: { color: "rgba(120,113,108,0.12)" },
              ticks: { color: "#78716c", font: { size: 9 }, maxTicksLimit: 4 },
            },
            y: {
              min: bounds.min,
              max: bounds.max,
              grid: {
                color: (ctx) => (ctx.tick && Math.abs(ctx.tick.value) < 0.001)
                  ? "rgba(87, 83, 78, 0.35)" : "rgba(120,113,108,0.12)",
                lineWidth: (ctx) => (ctx.tick && Math.abs(ctx.tick.value) < 0.001) ? 1.25 : 1,
              },
              ticks: {
                color: "#78716c",
                font: { size: 9 },
                callback: (v) => (v >= 0 ? "+" : "") + Number(v).toFixed(1) + "%",
              },
            },
          },
        },
        plugins: [zeroLinePlugin, endLabelPlugin],
      });
    }

    function renderSpyBenchmark(spy, live) {
      if (!spy?.points?.length) return;
      document.getElementById("spy-section").hidden = false;
      const vr = live?.valuation_refresh || {};
      document.getElementById("spy-refreshed").textContent =
        "Last refreshed: " + fmtTimestamp(vr.refreshed_at);

      const since = spy.since_start_pct;
      const month = spy.month_pct ?? since;
      const last30 = spy.last_30_days_pct;
      const price = spy.current_price;

      document.getElementById("spy-metrics").innerHTML =
        '<div class="metric"><span class="metric-label">Since start</span><span class="metric-value ' + retClass(since) + '">' + fmtRet(since) + "</span></div>" +
        '<div class="metric"><span class="metric-label">Last 30 days</span><span class="metric-value ' + retClass(last30) + '">' + fmtRet(last30) + "</span></div>" +
        '<div class="metric"><span class="metric-label">This month</span><span class="metric-value ' + retClass(month) + '">' + fmtRet(month) + "</span></div>" +
        '<div class="metric"><span class="metric-label">Current price</span><span class="metric-value neutral">' + fmtPrice(price) + "</span></div>";

      const seen = new Set();
      const rows = spy.points.filter((p) => {
        const k = p.date + "|" + (p.return_pct ?? "");
        if (seen.has(k)) return false;
        seen.add(k);
        return true;
      });
      const canvas = document.getElementById("chart-spy-benchmark");
      const pts = { chart_points: rows.map((p) => ({ date: p.date, portfolio_pct: p.return_pct })) };
      const ch = buildPortfolioChart(canvas, pts, "SPY");
      if (ch) charts.push(ch);
    }

    function buildSpyFallback(cycle) {
      if (!cycle) return null;
      const s = cycle.performance_vs_spy?.A;
      const pts = (s?.chart_points || []).map((p) => ({ date: p.date, return_pct: p.spy_pct }));
      if (!pts.length) return null;
      const since = pts[pts.length - 1].return_pct / 100;
      return { since_start_pct: since, month_pct: since, points: pts };
    }

    function verdictClass(v) {
      const s = (v || "").toLowerCase();
      if (s === "confirmed") return "confirmed";
      if (s === "falsified") return "falsified";
      return "unresolved";
    }

    function renderClassifications(data) {
      const grid = document.getElementById("classifications-grid");
      const countEl = document.getElementById("class-count");
      const rows = data?.classifications || [];
      if (!rows.length) {
        grid.textContent = "No classification data yet.";
        return;
      }
      countEl.textContent = rows.length + " companies classified as of " + (data.as_of || "—") + ".";
      grid.innerHTML = rows.map((r) =>
        '<div class="class-card"><div class="ticker">' + r.ticker + '</div>' +
        '<div class="state">' + (r.state || "—") + "</div>" +
        '<div class="date">Updated ' + (r.as_of || "—") + "</div></div>"
      ).join("");
    }

    function renderFindingItem(item) {
      const label = item.verdict || item.status || "";
      const rate = item.yes_rate != null
        ? '<div class="metric-def">' + (item.yes_rate_definition || "Yes-rate: share of comparison units where the pattern was detected.") +
          " · " + (item.n_definition || "n: number of independent comparison units.") +
          " · Measured: " + (item.yes_rate * 100).toFixed(1) + "% (n=" + item.n + ")</div>"
        : "";
      const def = item.definition ? '<div class="finding-def">' + item.definition + "</div>" : "";
      const verdictDef = item.verdict_definition ? '<div class="metric-def">' + item.verdict_definition + "</div>" : "";
      return '<div class="event-item">' +
        (label ? '<span class="verdict ' + verdictClass(label) + '">' + label + "</span>" : "") +
        "<strong>" + (item.id || "") + "</strong> " + (item.principle || item.text || "") +
        def + rate + verdictDef +
        (item.note ? '<div class="finding-def">' + item.note + "</div>" : "") +
        "</div>";
    }

    function renderEvidencePage(lib) {
      const root = document.getElementById("evidence-page");
      if (!lib) {
        root.textContent = "No evidence data yet.";
        return;
      }
      const intro = '<p class="intro-hero">' + (lib.intro || "") + "</p>" +
        '<p class="intro-note">' + (lib.state_label_note || "") + "</p>";
      const sections = [
        ["Investigation D — all six principles", lib.findings || []],
        ["Library 2 — confirmed", lib.library2_confirmed || []],
        ["Library 2 — falsified", lib.library2_falsified || []],
        ["Unresolved", lib.unresolved || []],
      ];
      const body = sections.map(([title, items]) => {
        if (!items.length) return "";
        return '<div class="event-section"><h3>' + title + '</h3><div class="event-list">' +
          items.map(renderFindingItem).join("") + "</div></div>";
      }).join("");
      const live = (lib.live_transition_patterns || []).length
        ? '<div class="event-section"><h3>Live transition patterns</h3><div class="event-list">' +
          lib.live_transition_patterns.map((item) =>
            '<div class="event-item">' + item.transition + " — detected " + item.count +
            " time(s)" + (item.example_ticker ? " (e.g. " + item.example_ticker + ", " + (item.example_date || "") + ")" : "") +
            "</div>"
          ).join("") + "</div></div>"
        : "";
      root.innerHTML = intro + body + live;
    }

    function renderActivityPage(activity) {
      const root = document.getElementById("activity-page");
      if (!activity) {
        root.textContent = "";
        return;
      }
      const events = activity.recent_events || [];
      const eventHtml = events.length
        ? events.map((e) => {
            const who = [e.portfolio, e.profile ? PROFILE_LABELS[e.profile] || e.profile : ""].filter(Boolean).join(" · ");
            const detail = e.ticker || (e.tickers || []).join(", ") || "";
            return '<div class="event-item">' +
              "<strong>" + (e.event_type || "event") + "</strong>" +
              (who ? " · " + who : "") +
              (detail ? " · " + detail : "") +
              (e.reason ? " — " + e.reason : "") +
              '<div class="finding-def">' + fmtTimestamp(e.recorded_at) + (e.as_of ? " · as of " + e.as_of : "") + "</div>" +
              "</div>";
          }).join("")
        : '<div class="event-item">No operational events recorded yet.</div>';

      const illus = activity.historical_illustrations || [];
      const illusHtml = illus.length
        ? '<div class="event-section"><h3>Historical illustrations</h3>' +
          '<p class="illus-note">' + (activity.historical_illustrations_note || "") + "</p>" +
          '<div class="event-list">' +
          illus.map((item) =>
            '<div class="event-item"><span class="verdict unresolved">' + (item.kind || "Illustration") + "</span>" +
            (item.text || "") +
            (item.source ? '<div class="finding-def">Source: ' + item.source + "</div>" : "") +
            "</div>"
          ).join("") +
          "</div></div>"
        : "";

      const liveTrans = activity.live_transitions || [];
      const transHtml = liveTrans.length
        ? '<div class="event-section"><h3>Live transition log</h3><div class="event-list">' +
          liveTrans.map((item) =>
            '<div class="event-item">' + item.transition + " — " + item.count + " time(s)" +
            (item.example_ticker ? " (e.g. " + item.example_ticker + ")" : "") + "</div>"
          ).join("") + "</div></div>"
        : "";

      root.innerHTML =
        '<div class="event-section"><h3>Operational event log</h3><div class="event-list">' +
        eventHtml + "</div></div>" + illusHtml + transHtml;
    }

    function setupTabs() {
      const buttons = document.querySelectorAll(".tab-btn");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          buttons.forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          document.querySelectorAll(".tab-panel").forEach((p) => p.classList.remove("active"));
          document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
        });
      });
    }

    async function init() {
      setupTabs();
      const pricesStrip = document.getElementById("prices-strip");
      const portfolioAEl = document.getElementById("portfolio-a");
      const portfoliosEl = document.getElementById("portfolios");

      try {
        const [live, activity, eventLibrary] = await Promise.all([
          loadJson("live_cycles.json"),
          loadJson("activity.json").catch(() =>
            loadJson("classifications.json").then((c) => ({
              classifications: c.classifications,
              as_of: c.as_of,
              recent_events: [],
              historical_illustrations: [],
            }))
          ),
          loadJson("event_library.json").catch(() => ({})),
        ]);
        renderEvidencePage(eventLibrary);
        renderClassifications({ classifications: activity.classifications || [], as_of: activity.as_of });
        renderActivityPage(activity);

        if (typeof Chart === "undefined") {
          pricesStrip.innerHTML = '<span class="error">Chart.js failed to load.</span>';
          return;
        }

        const vr = live.valuation_refresh || {};
        const marketThru = vr.market_data_through || vr.prices_as_of || "—";
        pricesStrip.innerHTML =
          'Prices through <strong>' + marketThru + "</strong> — the most recent trading day&rsquo;s closing prices" +
          " · last refreshed <strong>" + fmtTimestamp(vr.refreshed_at) + "</strong>" +
          (vr.stale_vs_calendar ? ' · <span class="warn">Awaiting newer close</span>' : "");

        const cyclesByProfile = {};
        for (const c of live.cycles || []) {
          if (c.profile) cyclesByProfile[c.profile] = c;
        }

        const referenceCycle = cyclesByProfile.conservative || cyclesByProfile.balanced || cyclesByProfile.aggressive;
        portfolioAEl.innerHTML = renderPortfolioASection(referenceCycle);

        const firstCycle = cyclesByProfile[PROFILE_ORDER.find((p) => cyclesByProfile[p])];
        const spyPayload = live.spy_benchmark || buildSpyFallback(firstCycle);

        portfoliosEl.innerHTML = MULTI_VARIANT_DISPLAY.map((letter) =>
          renderPortfolioBlock(letter, cyclesByProfile)
        ).join("");

        requestAnimationFrame(() => {
          charts.forEach((c) => c.destroy());
          charts.length = 0;
          renderSpyBenchmark(spyPayload, live);
          if (referenceCycle) {
            const aCanvas = document.getElementById("chart-A-single");
            if (aCanvas) {
              const ch = buildPortfolioChart(
                aCanvas,
                referenceCycle.performance_vs_spy?.[dataKeyFor("A")],
                "A"
              );
              if (ch) charts.push(ch);
            }
          }
          for (const displayLetter of MULTI_VARIANT_DISPLAY) {
            const dataKey = dataKeyFor(displayLetter);
            for (const profileKey of PROFILE_ORDER) {
              const cycle = cyclesByProfile[profileKey];
              if (!cycle) continue;
              const canvas = document.getElementById("chart-" + displayLetter + "-" + profileKey);
              if (!canvas) continue;
              const ch = buildPortfolioChart(canvas, cycle.performance_vs_spy?.[dataKey], displayLetter);
              if (ch) charts.push(ch);
            }
          }
        });

        document.getElementById("footer").textContent =
          "Tracking since " + (live.tracking_since || "—");
      } catch (err) {
        pricesStrip.innerHTML = '<span class="error">Failed to load: ' + err.message + "</span>";
        portfolioAEl.innerHTML = "";
        portfoliosEl.innerHTML = "";
      }
    }

    init();
  </script>
</body>
</html>
