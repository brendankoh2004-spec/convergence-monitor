<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Convergence Paper Monitor</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #6ea8fe;
      --border: #2a3548;
      --ok: #3dd68c;
      --ok-dim: rgba(61, 214, 140, 0.18);
      --behind: #e07070;
      --behind-dim: rgba(224, 112, 112, 0.15);
      --spy: #c4cad4;
      --warn: #f0c14b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      padding: 1.25rem 1.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.35rem; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.9rem; margin: 0.25rem 0; }
    main { padding: 1rem 1.5rem 2rem; max-width: 1280px; margin: 0 auto; }
    .status-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-bottom: 1.25rem;
    }
    .status-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.5rem; }
    .pill {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      background: #243044;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .pill.warn { color: var(--warn); }
    .tracking-note {
      color: var(--muted);
      font-size: 0.85rem;
      font-style: italic;
      margin: 0.35rem 0 0;
    }
    .profile-block {
      margin-bottom: 2rem;
    }
    .profile-block h2 {
      font-size: 1.15rem;
      color: var(--accent);
      margin: 0 0 0.35rem;
      text-transform: capitalize;
    }
    .profile-meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.75rem; }
    .portfolio-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }
    .portfolio-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1rem 1rem;
    }
    .portfolio-panel h3 {
      margin: 0 0 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .portfolio-panel h3 span.key {
      color: var(--accent);
      margin-right: 0.35rem;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem 0.75rem;
      font-size: 0.84rem;
      margin-bottom: 0.6rem;
    }
    .stat-label { color: var(--muted); }
    .stat-value { text-align: right; font-variant-numeric: tabular-nums; }
    .gain-pos { color: var(--ok); }
    .gain-neg { color: var(--behind); }
    .chart-wrap { position: relative; margin-top: 0.25rem; }
    canvas.chart {
      width: 100%;
      height: 140px;
      display: block;
      border-radius: 6px;
      background: #121820;
    }
    .chart-legend {
      display: flex;
      gap: 0.85rem;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }
    .legend-item { display: flex; align-items: center; gap: 0.3rem; }
    .legend-swatch {
      width: 14px;
      height: 3px;
      border-radius: 2px;
    }
    .legend-swatch.portfolio { background: var(--accent); }
    .legend-swatch.spy { background: var(--spy); }
    .b-holdings, .c-filter {
      margin-top: 0.55rem;
      padding-top: 0.55rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .b-row, .c-row {
      display: flex;
      justify-content: space-between;
      padding: 0.15rem 0;
      gap: 0.5rem;
    }
    .b-row .muted, .c-row .muted { color: var(--muted); }
    .backtest-section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      margin-top: 0.5rem;
    }
    .backtest-section h2 { margin: 0 0 0.75rem; font-size: 1rem; color: var(--accent); }
    .backtest-row {
      display: flex;
      justify-content: space-between;
      padding: 0.3rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }
    .error { color: #ff8a8a; }
    footer { padding: 0 1.5rem 1.5rem; color: var(--muted); font-size: 0.8rem; max-width: 1280px; margin: 0 auto; }
  </style>
</head>
<body>
  <header>
    <h1>Convergence Paper Monitor</h1>
    <p class="sub">Live paper portfolios · mark-to-market from ledger data</p>
  </header>
  <main>
    <div class="status-panel" id="status-panel">
      <div class="status-row" id="status-pills">Loading live data…</div>
      <p class="tracking-note" id="tracking-note"></p>
    </div>
    <div id="profiles"></div>
    <section class="backtest-section">
      <h2>Portfolio A — HT-B backtest (canonical Definition A)</h2>
      <div id="backtest"></div>
    </section>
  </main>
  <footer id="footer"></footer>

  <script>
    const DATA_BASE = "data";
    const PORTFOLIO_KEYS = ["A", "B", "C", "D"];
    const PORTFOLIO_LABELS = {
      A: "Pure Convergence",
      B: "Convergence + human judgment",
      C: "SPY structural filter",
      D: "Vanilla SPY",
    };

    function fmtMoney(v, signed) {
      if (v == null || Number.isNaN(v)) return "—";
      const n = Math.round(v);
      const abs = Math.abs(n).toLocaleString();
      if (signed && n > 0) return "+$" + abs;
      if (signed && n < 0) return "−$" + abs;
      return "$" + abs;
    }

    function fmtPct(v) {
      if (v == null || Number.isNaN(v)) return "—";
      return (v * 100).toFixed(1) + "%";
    }

    function fmtCagr(v) {
      if (v == null || Number.isNaN(v)) return "—";
      return Number(v).toFixed(2) + "%";
    }

    async function loadJson(path) {
      const res = await fetch(`${DATA_BASE}/${path}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
      return res.json();
    }

    function drawVsSpyChart(canvas, series) {
      const pts = (series?.points || []).filter(
        (p) => p.nav_index != null && p.spy_index != null
      );
      if (!pts.length) return;

      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(rect.width, 280);
      const h = 140;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      const pad = { l: 36, r: 10, t: 10, b: 22 };
      const iw = w - pad.l - pad.r;
      const ih = h - pad.t - pad.b;

      const allY = pts.flatMap((p) => [p.nav_index, p.spy_index]);
      let yMin = Math.min(...allY);
      let yMax = Math.max(...allY);
      const padY = (yMax - yMin) * 0.08 || 2;
      yMin -= padY;
      yMax += padY;

      const xAt = (i) => pad.l + (i / Math.max(pts.length - 1, 1)) * iw;
      const yAt = (v) => pad.t + ih - ((v - yMin) / (yMax - yMin)) * ih;

      ctx.clearRect(0, 0, w, h);

      // shaded area between lines
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i];
        const p1 = pts[i + 1];
        const x0 = xAt(i);
        const x1 = xAt(i + 1);
        const nav0 = yAt(p0.nav_index);
        const nav1 = yAt(p1.nav_index);
        const spy0 = yAt(p0.spy_index);
        const spy1 = yAt(p1.spy_index);
        const ahead = (p0.nav_index + p1.nav_index) / 2 >= (p0.spy_index + p1.spy_index) / 2;
        ctx.beginPath();
        ctx.moveTo(x0, nav0);
        ctx.lineTo(x1, nav1);
        ctx.lineTo(x1, spy1);
        ctx.lineTo(x0, spy0);
        ctx.closePath();
        ctx.fillStyle = ahead ? "rgba(61, 214, 140, 0.22)" : "rgba(224, 112, 112, 0.18)";
        ctx.fill();
      }

      // grid
      ctx.strokeStyle = "#2a3548";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad.l, pad.t);
      ctx.lineTo(pad.l, pad.t + ih);
      ctx.lineTo(pad.l + iw, pad.t + ih);
      ctx.stroke();

      // SPY line
      ctx.strokeStyle = "#c4cad4";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.beginPath();
      pts.forEach((p, i) => {
        const x = xAt(i);
        const y = yAt(p.spy_index);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
      ctx.setLineDash([]);

      // portfolio line
      ctx.strokeStyle = "#6ea8fe";
      ctx.lineWidth = 2;
      ctx.beginPath();
      pts.forEach((p, i) => {
        const x = xAt(i);
        const y = yAt(p.nav_index);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // x labels (first + last)
      ctx.fillStyle = "#8b9bb4";
      ctx.font = "10px IBM Plex Sans, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(pts[0].date.slice(5), xAt(0), h - 4);
      if (pts.length > 1) {
        ctx.fillText(pts[pts.length - 1].date.slice(5), xAt(pts.length - 1), h - 4);
      }

      // y labels
      ctx.textAlign = "right";
      ctx.fillText(yMin.toFixed(0), pad.l - 4, pad.t + ih);
      ctx.fillText(yMax.toFixed(0), pad.l - 4, pad.t + 8);
    }

    function renderPortfolioPanel(key, cycle) {
      const p = cycle.portfolios?.[key] || {};
      const gain = p.gain_loss_since_inception;
      const gainClass = gain > 0 ? "gain-pos" : gain < 0 ? "gain-neg" : "";
      const series = cycle.performance_vs_spy?.[key];
      const chartId = `chart-${cycle.profile}-${key}`;

      let extra = "";
      if (key === "B") {
        const rows = (cycle.b_holding_now || []).map((d) => {
          const pick = `<strong>${d.holding_now || d.recorded_pick || "—"}</strong>`;
          const status = d.is_live_position
            ? `<span style="color:var(--ok)">${d.ledger_status || "In ledger"}</span>`
            : `<span class="muted">${d.ledger_status || "Not in ledger"}</span>`;
          return `<div class="b-row"><span>${d.bucket}</span><span>${pick}<br>${status}</span></div>`;
        }).join("");
        const ledgerHeld = (cycle.b_ledger_holdings || [])
          .map((h) => `${h.ticker} (${Math.round(h.shares)} sh)`)
          .join(", ");
        const ledgerLine = ledgerHeld
          ? `<div class="muted" style="margin-top:0.35rem">B ledger holdings: ${ledgerHeld}</div>`
          : `<div class="muted" style="margin-top:0.35rem">B ledger holdings: none (100% cash)</div>`;
        extra = rows
          ? `<div class="b-holdings"><div class="muted" style="margin-bottom:0.25rem">Holding now (latest decision only)</div>${rows}${ledgerLine}</div>`
          : ledgerLine;
      }
      if (key === "C") {
        const f = cycle.portfolio_c_filter;
        if (f) {
          extra = `<div class="c-filter">
            <div class="c-row"><span class="muted">Universe</span><span>${f.n_universe ?? "—"}</span></div>
            <div class="c-row"><span class="muted">Excluded</span><span>${f.n_excluded ?? "—"} of ${f.n_universe ?? "—"}</span></div>
            <div class="c-row"><span class="muted">Forensic fail</span><span>${f.n_forensic_reject ?? "—"}</span></div>
            <div class="c-row"><span class="muted">Active L4 fracture</span><span>${f.n_active_l4_fracture ?? "—"}</span></div>
            ${f.n_other_excluded != null ? `<div class="c-row"><span class="muted">Other excluded</span><span>${f.n_other_excluded}</span></div>` : ""}
          </div>`;
        }
      }

      return `<div class="portfolio-panel">
        <h3><span class="key">${key}</span>${PORTFOLIO_LABELS[key] || p.name || ""}</h3>
        <div class="stat-grid">
          <span class="stat-label">NAV</span>
          <span class="stat-value">${fmtMoney(p.nav)}</span>
          <span class="stat-label">Gain/loss since tracking</span>
          <span class="stat-value ${gainClass}">${fmtMoney(gain, true)}</span>
          <span class="stat-label">Cash</span>
          <span class="stat-value">${fmtPct(p.cash_pct)}</span>
          <span class="stat-label">Deployed</span>
          <span class="stat-value">${fmtPct(p.deployed_pct)}</span>
        </div>
        <div class="chart-wrap">
          <canvas class="chart" id="${chartId}" aria-label="Portfolio vs SPY indexed performance"></canvas>
          <div class="chart-legend">
            <span class="legend-item"><span class="legend-swatch portfolio"></span>Portfolio (indexed)</span>
            <span class="legend-item"><span class="legend-swatch spy"></span>SPY (indexed)</span>
          </div>
        </div>
        ${extra}
      </div>`;
    }

    function renderProfileBlock(cycle) {
      const profile = cycle.profile;
      const ho = cycle.holdings_as_of || cycle.as_of;
      const po = cycle.prices_as_of || "—";
      const panels = PORTFOLIO_KEYS.map((k) => renderPortfolioPanel(k, cycle)).join("");
      return `<div class="profile-block" data-profile="${profile}">
        <h2>${profile}</h2>
        <p class="profile-meta">Holdings as of <strong>${ho}</strong> · Prices as of <strong>${po}</strong></p>
        <div class="portfolio-grid">${panels}</div>
      </div>`;
    }

    function renderBacktest(backtest) {
      const profiles = backtest.profiles || {};
      const order = ["conservative", "balanced", "aggressive"];
      return order.map((p) => {
        const block = profiles[p] || {};
        const range = block.cagr_range?.label || "—";
        return `<div class="backtest-row">
          <span>${p.charAt(0).toUpperCase() + p.slice(1)}</span>
          <span>mean ${fmtCagr(block.mean_cagr_pct)} · ${range}</span>
        </div>`;
      }).join("");
    }

    function paintCharts(cycles) {
      for (const cycle of cycles) {
        for (const key of PORTFOLIO_KEYS) {
          const id = `chart-${cycle.profile}-${key}`;
          const canvas = document.getElementById(id);
          if (!canvas) continue;
          drawVsSpyChart(canvas, cycle.performance_vs_spy?.[key]);
        }
      }
    }

    async function init() {
      const statusPills = document.getElementById("status-pills");
      const trackingNote = document.getElementById("tracking-note");
      const profilesEl = document.getElementById("profiles");
      const backtestEl = document.getElementById("backtest");
      const footer = document.getElementById("footer");

      try {
        const [live, backtest] = await Promise.all([
          loadJson("live_cycles.json"),
          loadJson("portfolio_a_backtest.json"),
        ]);

        const vr = live.valuation_refresh || {};
        const refreshed = vr.refreshed_at || live.exported_at || "—";
        const marketThru = vr.market_data_through || vr.prices_as_of || "—";
        const trackingSince = live.tracking_since || "—";

        statusPills.innerHTML = [
          `<span class="pill">Tracking since ${trackingSince}</span>`,
          `<span class="pill">Export ${live.exported_at || "—"}</span>`,
          `<span class="pill">Price refresh ${refreshed}</span>`,
          `<span class="pill">Market data through ${marketThru}</span>`,
          vr.stale_vs_calendar ? `<span class="pill warn">Market data through ${marketThru} — no newer close yet (calendar ${vr.calendar_today || "today"})</span>` : "",
        ].filter(Boolean).join(" ");

        trackingNote.textContent =
          live.tracking_note ||
          "Tracking duration is not holding duration — positions may change at every monthly review.";

        const cycles = (live.cycles || []).slice().sort((a, b) =>
          (a.profile || "").localeCompare(b.profile || "")
        );
        profilesEl.innerHTML = cycles.map(renderProfileBlock).join("");
        paintCharts(cycles);

        let resizeTimer;
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => paintCharts(cycles), 150);
        });

        backtestEl.innerHTML = renderBacktest(backtest);
        footer.textContent = [
          live.display?.note || "",
          backtest.harness_generation?.label ? `Backtest: ${backtest.harness_generation.label}.` : "",
          `Schema live ${live.schema || "?"} · backtest ${backtest.schema || "?"}.`,
        ].filter(Boolean).join(" ");
      } catch (err) {
        statusPills.innerHTML = `<span class="error">Failed to load data: ${err.message}</span>`;
        trackingNote.textContent = "";
        profilesEl.innerHTML = "";
        backtestEl.innerHTML = "";
      }
    }

    init();
  </script>
</body>
</html>
